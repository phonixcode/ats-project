name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  pack-win:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Allow long paths
        run: git config --global core.longpaths true

      - name: Build API
        working-directory: backend
        env:
          DATABASE_URL: 'file:./data/mg-ats.db'
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Build UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Pack Windows installer
        working-directory: desktop
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
          npm ci
          npm run pack:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MG-ATS-windows
          path: desktop/release/*.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" desktop/release/*.exe --title "${{ github.ref_name }}" --generate-notes --verify-tag
